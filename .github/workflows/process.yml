name: Video Processor
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *' # Runs exactly at 12:30 UTC (6:00 PM Sri Lanka Time) daily

jobs:
  process-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python packages
        run: pip install google-api-python-client google-auth httplib2
      - name: Run Processing Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.PROCESSED_FOLDER_ID }} # We will add this next!
        run: python process_video.py
